name: Deploy DAGs to Airflow Server
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.REMOTE_HOST }}

      # Code-only deploy: sync just the application code (dags/ and etl/).
      # No --delete, and runtime files managed on the host
      # (docker-compose.yaml, .env, config/, data/, logs/) are never touched.
      - name: Sync dags/ to server
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avz
          path: dags/
          remote_path: ~/airflow-project/dags/
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key:  ${{ secrets.REMOTE_KEY }}
          remote_port: ${{ secrets.REMOTE_PORT }}

      - name: Sync etl/ to server
        uses: burnett01/rsync-deployments@5.1
        with:
          switches: -avz
          path: etl/
          remote_path: ~/airflow-project/etl/
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key:  ${{ secrets.REMOTE_KEY }}
          remote_port: ${{ secrets.REMOTE_PORT }}
